name: Current upstream CSQTT contract

on:
  push:
    branches:
      - main
    paths:
      - "shared/**"
      - "rust-server/model.rs"
      - "rust-server/protocol.rs"
      - "tests/upstream-csqtt-server-contract.rs"
      - ".github/workflows/upstream-csqtt-contract.yml"
  pull_request:
    paths:
      - "shared/**"
      - "rust-server/model.rs"
      - "rust-server/protocol.rs"
      - "tests/upstream-csqtt-server-contract.rs"
      - ".github/workflows/upstream-csqtt-contract.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-csqtt-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-upstream-contract:
    name: Current amurcanov/csqtt protocol contract
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout extracted server contract
        uses: actions/checkout@v7

      - name: Checkout current upstream client
        uses: actions/checkout@v7
        with:
          repository: amurcanov/csqtt
          ref: main
          path: .client-contract/upstream
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache upstream client dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .client-contract/upstream/rust-client -> target
          key: upstream-csqtt-contract

      - name: Inject independent server contract fixture
        shell: bash
        run: |
          set -euo pipefail
          cp tests/upstream-csqtt-server-contract.rs \
            .client-contract/upstream/rust-client/server_contract_tests.rs
          printf '\n#[cfg(test)]\nmod server_contract_tests;\n' >> \
            .client-contract/upstream/rust-client/main.rs

      - name: Verify current upstream protocol contract
        working-directory: .client-contract/upstream/rust-client
        run: cargo test --locked --bin client server_contract_
