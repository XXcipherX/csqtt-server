name: Docker CI

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "rust-server/**"
      - "shared/**"
      - ".github/workflows/docker-ci.yml"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "rust-server/**"
      - "shared/**"
      - ".github/workflows/docker-ci.yml"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }} image build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AMD64
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - name: ARM64
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=oci,dest=/tmp/csqtt-image-${{ matrix.arch }}.tar
          pull: true
          push: false
          cache-from: type=gha,scope=csqtt-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=csqtt-docker-${{ matrix.arch }}
