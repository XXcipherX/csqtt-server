name: Rust toolchain CI

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "rust-server/Cargo.toml"
      - "rust-server/rust-toolchain.toml"
      - ".github/dependabot.yml"
      - ".github/scripts/check-rust-toolchain.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Dockerfile"
      - "rust-server/Cargo.toml"
      - "rust-server/rust-toolchain.toml"
      - ".github/dependabot.yml"
      - ".github/scripts/check-rust-toolchain.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    name: Check pinned Rust versions
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Docker and CI against rust-toolchain.toml
        run: python3 .github/scripts/check-rust-toolchain.py
