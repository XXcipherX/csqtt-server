version: 2

multi-ecosystem-groups:
  build-environment:
    schedule:
      interval: daily
      time: "04:10"
      timezone: Europe/Moscow

updates:
  - package-ecosystem: docker
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: build-environment

  - package-ecosystem: github-actions
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: build-environment

  - package-ecosystem: rust-toolchain
    directory: "/rust-server"
    patterns:
      - "*"
    multi-ecosystem-group: build-environment

  - package-ecosystem: cargo
    directory: "/rust-server"
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Moscow
    open-pull-requests-limit: 20
    groups:
      cargo-server-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

